name: Build AuraDex APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # ubuntu-20.04, не ubuntu-latest — Buildozer тянет за собой Android
    # NDK/SDK, который на свежих Ubuntu (22.04/24.04) часто не собирается
    # из-за несовместимости системного Python/openssl с этим тулчейном.
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev build-essential ccache

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Build APK with Buildozer
        run: |
          buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: auradex-apk
          path: bin/*.apk
